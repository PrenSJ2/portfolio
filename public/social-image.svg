<svg width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4a4a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111111;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="#111111"/>

  <!-- Gradient overlay -->
  <ellipse cx="900" cy="350" rx="500" ry="400" fill="url(#bg-gradient)" opacity="0.8"/>

  <!-- Name -->
  <text x="100" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="500" letter-spacing="8" fill="#8a8a8a">SEBASTIAN PRENTICE</text>

  <!-- Role -->
  <text x="100" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#ffffff">Developer</text>

  <!-- Line -->
  <line x1="385" y1="365" x2="580" y2="365" stroke="#ffffff" stroke-width="2" opacity="0.5"/>

  <!-- Plus symbol -->
  <text x="75" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="300" fill="#4a9090">+</text>

  <!-- Secondary role -->
  <text x="130" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#ffffff">DevOps</text>
</svg>
